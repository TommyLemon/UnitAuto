name: Android CI

on:
  push:
    branches: [ "main" ]
    # paths:
    #   - 'UnitAuto-Android/**'
  pull_request:
    branches: [ "main" ]
    # paths:
    #   - 'UnitAuto-Android/**'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Build gradlew
      run: gradle wrapper
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build UnitAuto-Android
